<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>English 6 Ôn Tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap">
<style>
:root{
  --ground:#FFF1E3; --ground-2:#FFE0C6; --surface:#FFFFFF; --surface-2:#FFF7EF;
  --ink:#3A2116; --ink-soft:#8A6350; --line:#3A2116; --shadow:rgba(58,33,22,.9);
  --orange:#FF6B1A; --orange-soft:#FFD9BC; --orange-deep:#C24400; --apricot:#FFB44F;
  --pink:#FF4E8A; --pink-soft:#FFDCE8; --mint:#0F9B8E; --mint-soft:#CFF0EC;
  --wrong:#D93025; --wrong-soft:#FFE0DD; --focus:#1D6FE0; --on-orange:#3A2116;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#241610; --ground-2:#2E1C14; --surface:#37241C; --surface-2:#2F1F18;
  --ink:#FFEEE0; --ink-soft:#D9B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange-soft:#5A2E17; --orange-deep:#FFA066; --pink-soft:#5A2336; --mint:#4FD6C8; --mint-soft:#163F3A;
  --wrong:#FF7A70; --wrong-soft:#4D1D19; --focus:#7DB2FF;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#241610; --ground-2:#2E1C14; --surface:#37241C; --surface-2:#2F1F18;
  --ink:#FFEEE0; --ink-soft:#D9B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange-soft:#5A2E17; --orange-deep:#FFA066; --pink-soft:#5A2336; --mint:#4FD6C8; --mint-soft:#163F3A;
  --wrong:#FF7A70; --wrong-soft:#4D1D19; --focus:#7DB2FF;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 8%,var(--ground-2) 0 6px,transparent 7px),radial-gradient(circle at 78% 22%,var(--orange-soft) 0 4px,transparent 5px),radial-gradient(circle at 40% 60%,var(--pink-soft) 0 5px,transparent 6px);
  background-size:220px 220px,180px 180px,260px 260px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
h1,h2,h3,.disp{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sticker{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 14px;font-weight:800;box-shadow:5px 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active,.btn.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.or{background:var(--orange);color:var(--on-orange)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:12px;box-shadow:3px 3px 0 var(--shadow)}
.btn.sm:active,.btn.sm.on{box-shadow:0 0 0 var(--shadow)}
.spk{width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid var(--line);background:var(--orange);color:var(--on-orange);display:grid;place-items:center;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s;padding:0}
.spk svg{width:20px;height:20px}
.spk.mini{width:32px;height:32px}.spk.mini svg{width:16px;height:16px}
.spk:hover{transform:translate(-1px,-1px)}
.spk.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow);background:var(--apricot)}
/* header */
.bunting{display:block;width:100%;height:46px}
.brand{display:flex;align-items:center;gap:10px;margin-top:4px}
.brand svg{width:44px;height:33px;flex:none}
.brand b{font-family:var(--display);font-weight:800;color:var(--orange-deep);letter-spacing:.08em;font-size:18px}
.book{color:var(--ink-soft);font-weight:700;font-size:14px;margin:2px 0 12px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 12px 2px;scrollbar-width:thin}
.chip{flex:none;border:2.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap}
.chip small{font-weight:700;color:var(--ink-soft)}
.chip[aria-current="true"]{background:var(--orange);color:var(--on-orange);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.chip[aria-current="true"] small{color:var(--on-orange)}
.hero{padding:18px 20px;display:grid;gap:8px;margin:6px 0 18px;position:relative;overflow:hidden}
.hero .un{font-family:var(--display);font-weight:800;color:var(--orange-deep);letter-spacing:.1em;font-size:15px}
.hero h1{font-size:clamp(28px,5vw,42px);font-weight:800}
.hero .vi{font-weight:700;color:var(--ink-soft);font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px;background:var(--surface-2)}
.pill.o{background:var(--orange-soft)}.pill.p{background:var(--pink-soft)}.pill.m{background:var(--mint-soft)}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:8px;overflow-x:auto;padding:10px 4px 12px;margin:0 -4px 14px;border-bottom:2.5px dashed var(--line)}
.tab{flex:none;border:2.5px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 14px;font-weight:800;font-family:var(--display);font-size:16px;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--orange);color:var(--on-orange);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.sec-h h2{font-size:26px}
.note{color:var(--ink-soft);font-size:14px;font-weight:600}
.grp{font-family:var(--display);font-weight:700;font-size:19px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.grp::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--apricot);border:2px solid var(--line);transform:rotate(45deg)}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.vcard{padding:12px;display:flex;flex-direction:column;gap:8px}
.vcard .pic{height:92px;display:grid;place-items:center;font-size:52px;border:2.5px dashed var(--line);border-radius:26px 30px 24px 32px;background:var(--surface-2)}
.vcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard .row>div{min-width:0}
.en{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.vcard .row .spk{width:36px;height:36px}
.ipa{color:var(--ink-soft);font-size:14px}
.vi-m{font-weight:800;color:var(--orange-deep);font-size:15px}
.exl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-soft);margin-top:2px}
.exr{display:flex;gap:6px;align-items:flex-start;font-size:14px;border-top:2px dotted var(--ink-soft);padding-top:6px}
.exr p{margin:0;flex:1}
mark.hl{background:none;color:var(--orange-deep);font-weight:800}
/* structs */
.slist{display:grid;gap:18px}
.scard{padding:16px 18px;display:grid;gap:10px}
.scard h3{font-size:21px;display:flex;gap:8px;align-items:center}
.scard h3 .ix{font-size:13px;border:2px solid var(--line);border-radius:8px;padding:0 7px;background:var(--apricot);color:var(--on-orange)}
.formula{border:2.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-weight:800;background:var(--surface-2);line-height:2}
.formula .v{background:var(--orange);color:var(--on-orange);border:2px solid var(--line);border-radius:8px;padding:1px 7px}
.tip{background:var(--mint-soft);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.tip b{color:var(--orange-deep)}
.exs{display:grid;gap:8px}
.exs .e{display:flex;gap:10px;align-items:center}
.exs .e .t{min-width:0}
.exs .e .t b{display:block}
.exs .e .t span{color:var(--ink-soft);font-size:14px}
/* story */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;margin:4px 0 12px}
b.w{color:var(--orange-deep);font-weight:800}
i.s{font-style:normal;text-decoration:underline dotted var(--mint) 3px;text-underline-offset:4px;font-weight:700}
.story{padding:16px;display:grid;gap:4px}
.sline{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:12px}
.sline p{margin:0;font-size:17px;flex:1}
.sline.active{background:var(--orange-soft)}
.qlist{display:grid;gap:12px;margin-top:16px}
.q{padding:12px 14px;display:grid;gap:8px}
.q .qt{font-weight:800;display:flex;gap:8px;align-items:center}
.yn{display:flex;gap:10px}
.btn.picked{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.good{background:var(--mint-soft)}.btn.bad{background:var(--wrong-soft)}
.fb{border-radius:12px;padding:8px 12px;border:2px solid var(--line);font-size:15px}
.fb.ok{background:var(--mint-soft)}.fb.no{background:var(--wrong-soft)}
.score{font-family:var(--display);font-weight:800;font-size:20px}
.stars{color:var(--apricot);letter-spacing:2px;-webkit-text-stroke:1px var(--line)}
/* practice */
.pbar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.jumps{display:flex;gap:6px;flex-wrap:wrap}
.jumps a{color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:800;font-size:13px;background:var(--surface-2)}
.ex{padding:16px;margin-bottom:20px;scroll-margin-top:80px}
.ex h3{font-size:22px}
.ex .ins{color:var(--ink-soft);font-weight:600;margin:2px 0 12px;font-size:15px}
.items{display:grid;gap:12px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2);display:grid;gap:8px}
.item .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:50%;background:var(--apricot);border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:var(--on-orange)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;font-weight:800;text-align:center;box-shadow:3px 3px 0 var(--shadow)}
.opt .em{font-size:30px;display:block}
.opt.good{background:var(--mint-soft)}.opt.bad{background:var(--wrong-soft)}
.opt[disabled]{cursor:default}
.fill{width:11ch;border:none;border-bottom:3px solid var(--orange);background:transparent;font:inherit;font-weight:800;color:var(--ink);text-align:center;padding:0 2px}
.fill:focus{outline:none;background:var(--orange-soft)}
input.qin{width:100%;border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tray,.ans{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:6px;border-radius:12px}
.ans{border:2.5px dashed var(--line);background:var(--surface)}
.tk{border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:800;background:var(--orange-soft);box-shadow:2px 2px 0 var(--shadow)}
.ans .tk{background:var(--apricot);color:var(--on-orange)}
.done{font-weight:800}
.done.ok{color:var(--mint)}.done.no{color:var(--wrong)}
/* mistakes */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.mcard{padding:14px;display:grid;gap:8px;align-content:start}
.tag{justify-self:start;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-weight:800;font-size:13px;background:var(--pink-soft)}
.bad-row{background:var(--wrong-soft);border-radius:10px;padding:6px 10px}
.bad-row s{text-decoration-thickness:2px;text-decoration-color:var(--wrong)}
.good-row{background:var(--mint-soft);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:700}
/* flashcards */
.deck{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn.sel{background:var(--orange);color:var(--on-orange);transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.prog{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;margin-bottom:10px}
.pbarline{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;margin-bottom:14px}
.pbarline i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.scene{perspective:1400px;max-width:560px;margin:0 auto}
.fcard{position:relative;height:clamp(320px,50vh,420px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.25,1)}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.fcard:not(.flipped) .face.back{pointer-events:none}
.fcard.flipped .face.front{pointer-events:none}
.face .big{font-size:80px;line-height:1}
.face .fvi{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px)}
.face .fen{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,38px);color:var(--orange-deep);overflow-wrap:anywhere}
.again{position:absolute;top:12px;left:12px;background:var(--pink-soft);border:2px solid var(--line);border-radius:999px;padding:0 10px;font-weight:800;font-size:13px}
.hint{color:var(--ink-soft);font-weight:700;font-size:14px}
.fbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.congrats{padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;position:relative;overflow:hidden;max-width:560px;margin:0 auto}
.congrats::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;background-image:radial-gradient(circle,var(--orange) 0 4px,transparent 5px),radial-gradient(circle,var(--pink) 0 3px,transparent 4px),radial-gradient(circle,var(--mint) 0 4px,transparent 5px);background-size:60px 60px,44px 44px,76px 76px;background-position:0 0,20px 14px,34px 40px}
.congrats>*{position:relative}
.congrats .tro{font-size:72px}
.congrats h2{font-size:34px}
.congrats .st{font-size:34px;color:var(--apricot);-webkit-text-stroke:1.5px var(--line);letter-spacing:4px}
.novoice{display:none;background:var(--wrong-soft);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:700}
.novoice.show{display:block}
footer{margin-top:30px;border-top:2.5px dashed var(--line);padding-top:14px;font-size:14px;color:var(--ink-soft);display:grid;gap:4px}
footer b{color:var(--orange-deep);font-family:var(--display);letter-spacing:.06em}
@media (max-width:420px){.en{font-size:17px}.vcard{padding:10px}.vgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mgrid{grid-template-columns:1fr}.hero{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
UNITS=[{"n":1,"en":"My New School","vi":"Trường mới của em","pages":"6–15","vocab":[{"g":"School things – Đồ dùng học tập","w":[["pencil sharpener","/ˈpensl ˌʃɑːpənə/","cái gọt bút chì","✏️","I need a pencil sharpener for my pencils."],["compass","/ˈkʌmpəs/","com-pa","🧭","I draw a circle with a compass."],["calculator","/ˈkælkjuleɪtə/","máy tính cầm tay","🧮","My calculator is on the desk."],["rubber","/ˈrʌbə/","cục tẩy","🧽","Can I borrow your rubber, please?"],["pencil case","/ˈpensl keɪs/","hộp bút","👝","My pencil case is blue."],["school bag","/ˈskuːl bæɡ/","cặp sách","🎒","My school bag is heavy today."],["textbook","/ˈtekstbʊk/","sách giáo khoa","📘","Open your textbook, please."],["uniform","/ˈjuːnɪfɔːm/","đồng phục","👔","We wear a uniform at school."]]},{"g":"Subjects & activities – Môn học & hoạt động","w":[["lessons","/ˈlesnz/","các tiết học","🏫","We have lessons in the morning."],["homework","/ˈhəʊmwɜːk/","bài tập về nhà","📝","I do my homework after dinner."],["science","/ˈsaɪəns/","môn khoa học","🔬","We study science on Mondays."],["history","/ˈhɪstri/","môn lịch sử","🏛️","We study history at school."],["English","/ˈɪŋɡlɪʃ/","tiếng Anh","🔤","I love English very much."],["music","/ˈmjuːzɪk/","âm nhạc","🎵","We have music on Friday."],["art","/ɑːt/","mỹ thuật","🎨","We have art on Tuesday."],["subject","/ˈsʌbdʒɪkt/","môn học","📚","Maths is my favourite subject."],["football","/ˈfʊtbɔːl/","bóng đá","⚽","The boys play football at break time."],["exercise","/ˈeksəsaɪz/","tập thể dục","🤸","I do exercise every morning."],["lunch","/lʌntʃ/","bữa trưa","🍱","We have lunch at school."]]},{"g":"From the reading – Từ trong bài đọc","w":[["classmate","/ˈklɑːsmeɪt/","bạn cùng lớp","🧑‍🤝‍🧑","Duy is my new classmate."],["excited","/ɪkˈsaɪtɪd/","hào hứng","🤩","I am excited about my new school."],["boarding school","/ˈbɔːdɪŋ skuːl/","trường nội trú","🛏️","Sunrise is a boarding school in Sydney."],["international school","/ˌɪntəˈnæʃnəl skuːl/","trường quốc tế","🌏","Dream is an international school."],["club","/klʌb/","câu lạc bộ","🎭","I join the art club after school."],["mountain","/ˈmaʊntən/","ngọn núi","⛰️","Our school is near a mountain."]]}],"structs":[{"em":"🙋","ti":"Hiện tại đơn với I / You / We / They","f":"{I / You / We / They} + {động từ nguyên mẫu} ...","ex":"Nói về <b>thói quen</b>, việc làm <b>hằng ngày</b>. Với I, you, we, they thì động từ <b>giữ nguyên</b>.","p":[["I go to school by bike.","Mình đi học bằng xe đạp."],["We have lessons in the morning.","Chúng mình học vào buổi sáng."],["They play football after school.","Họ chơi bóng đá sau giờ học."]]},{"em":"👧","ti":"Hiện tại đơn với He / She / It","f":"{He / She / It} + {động từ + s / es}","ex":"Với <b>he, she, it</b> (hoặc 1 người), động từ phải <b>thêm s hoặc es</b>: play → play<b>s</b>, go → go<b>es</b>, study → stud<b>ies</b>, have → <b>has</b>.","p":[["She studies English every day.","Bạn ấy học tiếng Anh mỗi ngày."],["Phong goes to school by bus.","Phong đi học bằng xe buýt."],["My brother has a new school bag.","Anh trai mình có một cặp sách mới."]]},{"em":"🙅","ti":"Câu phủ định hiện tại đơn","f":"S + {don't / doesn't} + {động từ nguyên mẫu}","ex":"I, you, we, they dùng <b>don't</b>. He, she, it dùng <b>doesn't</b>. Sau don't / doesn't động từ <b>không thêm s</b>.","p":[["I don't like school lunch.","Mình không thích bữa trưa ở trường."],["She doesn't walk to school.","Bạn ấy không đi bộ đến trường."],["They don't have music on Monday.","Họ không có tiết nhạc vào thứ Hai."]]},{"em":"❓","ti":"Câu hỏi Yes/No hiện tại đơn","f":"{Do / Does} + S + {động từ nguyên mẫu}? – Yes, S + {do / does}. / No, S + {don't / doesn't}.","ex":"Đưa <b>Do</b> hoặc <b>Does</b> lên đầu câu để hỏi. Trả lời ngắn bằng do / does / don't / doesn't.","p":[["Do you like science? – Yes, I do.","Bạn có thích môn khoa học không? – Có."],["Does Vy ride a bike to school? – No, she doesn't.","Vy có đạp xe đi học không? – Không."],["Do they study history? – Yes, they do.","Họ có học lịch sử không? – Có."]]},{"em":"🔁","ti":"Trạng từ chỉ tần suất","f":"S + {always / usually / often / sometimes / rarely / never} + động từ","ex":"Cho biết <b>bao lâu làm 1 lần</b>: always (luôn luôn) > usually > often > sometimes > rarely > never (không bao giờ). Đứng <b>trước động từ thường</b>, nhưng <b>sau am / is / are</b>.","p":[["Tom usually takes the bus to school.","Tom thường đi xe buýt đến trường."],["I never forget my homework.","Mình không bao giờ quên bài tập về nhà."],["She is always happy at school.","Bạn ấy luôn vui vẻ ở trường."]]},{"em":"🤝","ti":"Giới thiệu một người bạn","f":"{Tên}, this is {tên}, my new friend. – Nice to meet you.","ex":"Dùng <b>this is</b> để giới thiệu một người với người khác. Người được giới thiệu đáp lại: <b>Nice to meet you.</b>","p":[["Phong, this is Duy, my new friend.","Phong, đây là Duy, bạn mới của mình."],["Hi, Duy. Nice to meet you.","Chào Duy. Rất vui được gặp bạn."],["Mum, this is Vy, my classmate.","Mẹ ơi, đây là Vy, bạn cùng lớp của con."]]}],"storyNote":"Story do Claude viết lại dựa trên nhân vật Phong, Vy, Duy trong bài Getting Started và Everyday English của Unit 1 (không phải nguyên văn sách).","story":["Today is Phong's first day at his new school. He is very <b class=\"w\">excited</b>.","He wears his new <b class=\"w\">uniform</b> and puts his new books in his <b class=\"w\">school bag</b>.","At school, Vy says, <i class=\"s\">\"Phong, this is Duy, my new friend.\"</i>","Duy says, <i class=\"s\">\"Nice to meet you.\"</i> Now Duy is Phong's new <b class=\"w\">classmate</b>.","They have <b class=\"w\">English</b>, <b class=\"w\">science</b> and <b class=\"w\">music</b> today.","At break time, Phong and Duy <i class=\"s\">often play</i> <b class=\"w\">football</b>.","Phong <i class=\"s\">doesn't like</i> school <b class=\"w\">lunch</b>, but he loves his new friends.","After school, he <i class=\"s\">always does</i> his <b class=\"w\">homework</b>."],"qs":[["Is Phong excited about his new school?","Y","Yes, he is. He is very excited.","He is very excited.","Phong rất hào hứng."],["Does Phong wear old clothes to school?","N","No, he doesn't. He wears his new uniform.","He wears his new uniform.","Phong mặc đồng phục mới."],["Do Phong and Duy often play football at break time?","Y","Yes, they do.","At break time, Phong and Duy often play football.","Giờ ra chơi hai bạn thường đá bóng."],["Does Phong like school lunch?","N","No, he doesn't.","Phong doesn't like school lunch.","Phong không thích bữa trưa ở trường."],["Does Phong always do his homework after school?","Y","Yes, he does.","After school, he always does his homework.","Sau giờ học Phong luôn làm bài tập."]],"mcq":[["She ___ English every day.",["study","studies","studying"],1,"She là ngôi thứ 3 số ít, study → studies."],["I ___ like school lunch.",["don't","doesn't","not"],0,"I dùng don't."],["My brother ___ football after school.",["play","plays","playing"],1,"My brother = he → plays."],["___ you have music on Friday?",["Does","Are","Do"],2,"You dùng Do để hỏi."],["Tom ___ takes the bus to school.",["usually","usual","use"],0,"Trạng từ tần suất usually đứng trước động từ."],["We ___ lessons in the morning.",["have","has","having"],0,"We dùng have."],["I draw a circle with a ___.",["rubber","compass","calculator"],1,"Com-pa (compass) dùng để vẽ hình tròn."],["We play ___ at break time.",["homework","football","lunch"],1,"Play football = chơi bóng đá."],["She is ___ happy at school.",["always","do","does"],0,"Trạng từ tần suất đứng sau is."],["Phong, ___ is Duy, my new friend.",["that","this","these"],1,"Giới thiệu người: this is ..."]],"qw":[["Yes, I do. I like science.",["Do you like science?"]],["No, she doesn't. She walks to school.",["Does she ride a bike to school?","Does she go to school by bike?","Does she cycle to school?"]],["I go to school by bus.",["How do you go to school?","How do you get to school?"]],["My favourite subject is English.",["What is your favourite subject?","What's your favourite subject?"]],["We have music on Friday.",["When do you have music?","When do we have music?"]],["He plays football at break time.",["What does he do at break time?","When does he play football?"]],["Yes, he does. He does his homework every day.",["Does he do his homework every day?"]],["My school has about 1,200 students.",["How many students does your school have?","How many students are there in your school?"]],["No, I don't. I don't like school lunch.",["Do you like school lunch?"]],["Yes, they do. They study history.",["Do they study history?"]]],"mistakes":[["He/She + s","She study English every day.","She studies English every day.","Với <b>she</b>, động từ phải thêm <b>s/es</b>: study → <b>studies</b>."],["doesn't + V","He doesn't likes maths.","He doesn't like maths.","Sau <b>doesn't</b> động từ <b>không thêm s</b>."],["Do / Does","Does you like music?","Do you like music?","<b>You</b> đi với <b>Do</b>, không đi với Does."],["Vị trí trạng từ","I go usually to school by bike.","I usually go to school by bike.","Trạng từ tần suất đứng <b>trước động từ thường</b>."],["Vị trí trạng từ","She always is happy.","She is always happy.","Với <b>am / is / are</b>, trạng từ đứng <b>sau</b>."],["have / has","My school have a big library.","My school has a big library.","My school = it → dùng <b>has</b>."],["do homework","I make my homework after dinner.","I do my homework after dinner.","Nói <b>do homework</b>, không nói make homework."],["play / do / study","I play exercise every morning.","I do exercise every morning.","Nói <b>do exercise</b>; play đi với môn thể thao có bóng: play football."]]},{"n":2,"en":"My House","vi":"Ngôi nhà của em","pages":"16–25","vocab":[{"g":"Types of houses – Kiểu nhà","w":[["town house","/ˈtaʊn haʊs/","nhà phố","🏘️","Mi lives in a town house."],["country house","/ˈkʌntri haʊs/","nhà ở nông thôn","🏡","My grandparents live in a country house."],["flat","/flæt/","căn hộ","🏢","We will move to a flat next month."],["hotel","/həʊˈtel/","khách sạn","🏨","Crazy House is a hotel in Da Lat."]]},{"g":"Rooms – Các phòng","w":[["living room","/ˈlɪvɪŋ ruːm/","phòng khách","📺","We watch TV in the living room."],["bedroom","/ˈbedruːm/","phòng ngủ","🛏️","My bedroom is small but nice."],["bathroom","/ˈbɑːθruːm/","phòng tắm","🛁","The bathroom is next to my room."],["kitchen","/ˈkɪtʃɪn/","nhà bếp","🍳","My mum is cooking in the kitchen."],["hall","/hɔːl/","sảnh, hành lang","🚪","There is a picture in the hall."]]},{"g":"Furniture – Đồ đạc trong nhà","w":[["lamp","/læmp/","cái đèn","💡","There is a lamp on the desk."],["toilet","/ˈtɔɪlət/","nhà vệ sinh, bồn cầu","🚽","The toilet is behind the kitchen."],["picture","/ˈpɪktʃə/","bức tranh","🖼️","The picture is on the wall."],["cupboard","/ˈkʌbəd/","tủ chén, tủ đựng đồ","🗄️","The bowls are in the cupboard."],["sink","/sɪŋk/","bồn rửa","🚰","There are dishes in the sink."],["sofa","/ˈsəʊfə/","ghế sô-pha","🛋️","The cat is on the sofa."],["dishwasher","/ˈdɪʃwɒʃə/","máy rửa bát","🍽️","We have a dishwasher in the kitchen."],["fridge","/frɪdʒ/","tủ lạnh","🧊","The milk is in the fridge."],["shower","/ˈʃaʊə/","vòi hoa sen","🚿","I have a shower every evening."],["chest of drawers","/ˌtʃest əv ˈdrɔːz/","tủ ngăn kéo","🗃️","My clothes are in the chest of drawers."],["wardrobe","/ˈwɔːdrəʊb/","tủ quần áo","👗","The wardrobe is next to the bed."],["desk","/desk/","bàn học","🖥️","My desk is under the window."],["shelf","/ʃelf/","cái giá, kệ","📚","The books are on the shelf."],["bed","/bed/","cái giường","🛌","The cat is under the bed."],["poster","/ˈpəʊstə/","áp phích","🪧","There is a big poster on the wall."],["department store","/dɪˈpɑːtmənt stɔː/","cửa hàng bách hóa","🛍️","Let's go to the department store."]]}],"structs":[{"em":"🏠","ti":"There is / There are","f":"There is {a / an + danh từ số ít}. / There are {danh từ số nhiều}.","ex":"Dùng để nói <b>có cái gì ở đâu</b>. 1 thứ dùng <b>There is</b>, từ 2 thứ trở lên dùng <b>There are</b>.","p":[["There is a lamp on the desk.","Có một cái đèn trên bàn học."],["There are two bedrooms in my house.","Nhà mình có hai phòng ngủ."],["There are four chairs in the kitchen.","Có bốn cái ghế trong bếp."]]},{"em":"❓","ti":"Is there ...? / Are there ...?","f":"{Is there / Are there} + ...? – Yes, there {is / are}. / No, there {isn't / aren't}.","ex":"Đảo <b>is / are</b> lên trước <b>there</b> để hỏi. Câu hỏi với <b>any</b> dùng Are there any ...?","p":[["Is there a sofa in the living room? – Yes, there is.","Phòng khách có ghế sô-pha không? – Có."],["Are there any pictures in your bedroom? – No, there aren't.","Phòng ngủ của bạn có tranh không? – Không."],["Is there a fridge in the kitchen? – Yes, there is.","Trong bếp có tủ lạnh không? – Có."]]},{"em":"🔑","ti":"Sở hữu cách 's","f":"{Tên người} + 's + {đồ vật}","ex":"Thêm <b>'s</b> sau tên người để nói <b>đồ vật của ai</b>. Elena's room = phòng <b>của</b> Elena.","p":[["This is Elena's room.","Đây là phòng của Elena."],["My mum's book is on the shelf.","Sách của mẹ mình ở trên giá."],["Nick's house is in the country.","Nhà của Nick ở nông thôn."]]},{"em":"📍","ti":"Giới từ chỉ vị trí","f":"The {đồ vật} is {in / on / under / next to / behind / in front of / between} the {nơi chốn}.","ex":"<b>in</b> = trong, <b>on</b> = trên, <b>under</b> = dưới, <b>next to</b> = bên cạnh, <b>behind</b> = phía sau, <b>in front of</b> = phía trước, <b>between</b> = ở giữa (2 vật).","p":[["The cat is under the bed.","Con mèo ở dưới gầm giường."],["The lamp is next to the bed.","Cái đèn ở cạnh giường."],["The desk is between the bed and the wardrobe.","Bàn học ở giữa giường và tủ quần áo."]]},{"em":"🔎","ti":"Hỏi đồ vật ở đâu","f":"Where {is / are} the {đồ vật}? – {It's / They're} + giới từ + nơi chốn.","ex":"1 vật: <b>Where is ...? – It's ...</b>. Nhiều vật: <b>Where are ...? – They're ...</b>","p":[["Where is the cat? – It's on the sofa.","Con mèo đâu rồi? – Nó ở trên ghế sô-pha."],["Where are the books? – They're on the shelf.","Sách ở đâu? – Chúng ở trên giá."],["Where is your house? – It's near the park.","Nhà bạn ở đâu? – Ở gần công viên."]]},{"em":"💡","ti":"Đưa ra gợi ý","f":"How about + {V-ing}? / Let's + {động từ nguyên mẫu}.","ex":"<b>How about</b> + động từ thêm <b>-ing</b>. <b>Let's</b> + động từ <b>giữ nguyên</b>. Đồng ý: Good idea! / OK.","p":[["How about putting a picture on the wall?","Hay là treo một bức tranh lên tường nhé?"],["Let's go to the department store.","Chúng mình đi cửa hàng bách hóa đi."],["How about buying a new lamp?","Hay là mua một cái đèn mới nhé?"]]}],"storyNote":"Story do Claude viết dựa theo tình huống email của Nick ở khách sạn Crazy House (Đà Lạt) trong Skills 1 Unit 2; không phải nguyên văn sách.","story":["Dear Mi, I'm on holiday in Da Lat with my parents.","We are staying at the Crazy House <b class=\"w\">hotel</b>. It's a very strange <b class=\"w\">hotel</b>!","<i class=\"s\">There are</i> ten rooms, and our room is the Tiger Room.","<i class=\"s\">There is</i> a big tiger on the wall.","The <b class=\"w\">bed</b> is <i class=\"s\">between</i> the tiger and the window.","<i class=\"s\">There is</i> a <b class=\"w\">lamp</b> <i class=\"s\">next to</i> the <b class=\"w\">bed</b>, and a <b class=\"w\">wardrobe</b> <i class=\"s\">in front of</i> it.","<i class=\"s\">There isn't</i> a TV in the room, but I love it!","<i class=\"s\">How about staying</i> here with your family next summer? Best wishes, Nick."],"qs":[["Is Nick on holiday in Da Lat?","Y","Yes, he is.","I'm on holiday in Da Lat with my parents.","Nick đang đi nghỉ ở Đà Lạt."],["Are there twenty rooms in the hotel?","N","No, there aren't. There are ten rooms.","There are ten rooms.","Khách sạn có mười phòng."],["Is there a big tiger on the wall?","Y","Yes, there is.","There is a big tiger on the wall.","Trên tường có một con hổ lớn."],["Is there a TV in the room?","N","No, there isn't.","There isn't a TV in the room.","Trong phòng không có TV."],["Does Nick love the room?","Y","Yes, he does.","There isn't a TV in the room, but I love it!","Nick rất thích căn phòng."]],"mcq":[["There ___ a lamp on the desk.",["is","are","am"],0,"A lamp là số ít → There is."],["There ___ two bedrooms in my house.",["is","are","be"],1,"Two bedrooms số nhiều → There are."],["The cat is ___ the bed. (dưới)",["on","under","in"],1,"Dưới = under."],["This is ___ room.",["Elena","Elenas","Elena's"],2,"Sở hữu cách: Elena's room."],["The desk is ___ the bed and the wardrobe.",["between","next","behind of"],0,"Ở giữa 2 vật: between ... and ..."],["How about ___ a picture on the wall?",["put","putting","to put"],1,"How about + V-ing."],["Let's ___ to the department store.",["go","going","goes"],0,"Let's + động từ nguyên mẫu."],["___ there any pictures in your room?",["Is","Are","Do"],1,"Pictures số nhiều → Are there any ...?"],["We keep milk and eggs in the ___.",["sink","fridge","wardrobe"],1,"Tủ lạnh = fridge."],["Where ___ the books? – They're on the shelf.",["is","are","am"],1,"The books số nhiều → Where are ...?"]],"qw":[["It's on the sofa. The cat is on the sofa.",["Where is the cat?","Where's the cat?"]],["They're on the shelf. The books are on the shelf.",["Where are the books?"]],["Yes, there is. There is a fridge in the kitchen.",["Is there a fridge in the kitchen?"]],["No, there aren't. There aren't any pictures in my room.",["Are there any pictures in your room?","Are there pictures in your room?"]],["I live in a town house.",["Where do you live?","What kind of house do you live in?","What type of house do you live in?"]],["There are three bedrooms in my house.",["How many bedrooms are there in your house?","How many bedrooms does your house have?"]],["It's Elena's room.",["Whose room is it?","Whose room is this?"]],["Yes, I do. I live in a flat.",["Do you live in a flat?"]],["My house is near the park.",["Where is your house?","Where's your house?"]],["No, there isn't. There isn't a TV in my bedroom.",["Is there a TV in your bedroom?"]]],"mistakes":[["There is / are","There is two lamps in my room.","There are two lamps in my room.","Hai cái đèn là <b>số nhiều</b> → dùng <b>There are</b>."],["There are + N-s","There are three bedroom.","There are three bedrooms.","Sau số đếm lớn hơn 1, danh từ <b>thêm s</b>."],["Sở hữu cách","This is room of Mai.","This is Mai's room.","Tiếng Anh nói <b>Mai's room</b>, không dịch từng chữ \"phòng của Mai\"."],["next to","The lamp is next the bed.","The lamp is next to the bed.","Nhớ đủ cụm <b>next to</b>."],["in front of","The wardrobe is in front the bed.","The wardrobe is in front of the bed.","Cụm đầy đủ là <b>in front of</b>."],["How about + V-ing","How about put a picture on the wall?","How about putting a picture on the wall?","Sau <b>How about</b> động từ thêm <b>-ing</b>."],["Let's + V","Let's going to the store.","Let's go to the store.","Sau <b>Let's</b> động từ <b>giữ nguyên</b>."],["Where are","Where is the books?","Where are the books?","The books là số nhiều → <b>Where are</b>."]]},{"n":3,"en":"My Friends","vi":"Bạn bè của em","pages":"26–35","vocab":[{"g":"Appearance – Ngoại hình","w":[["hair","/heə/","tóc","💇","She has long black hair."],["eyes","/aɪz/","đôi mắt","👀","Chau has big brown eyes."],["nose","/nəʊz/","cái mũi","👃","He has a small nose."],["cheeks","/tʃiːks/","đôi má","😊","Mai has round cheeks."],["shoulder","/ˈʃəʊldə/","vai","🤷","He has a bag on his shoulder."],["blonde","/blɒnd/","(tóc) vàng hoe","👱","Lucy has blonde hair."],["curly","/ˈkɜːli/","xoăn","👩‍🦱","Phong has curly hair."],["glasses","/ˈɡlɑːsɪz/","kính mắt","👓","Chau wears glasses."]]},{"g":"Personality – Tính cách","w":[["kind","/kaɪnd/","tốt bụng","🤗","My best friend is kind to everyone."],["creative","/kriˈeɪtɪv/","sáng tạo","🖍️","Mai is creative. She draws very well."],["shy","/ʃaɪ/","nhút nhát","🙈","Nam is shy with new friends."],["clever","/ˈklevə/","thông minh","🧠","Phong is clever. He is good at maths."],["friendly","/ˈfrendli/","thân thiện","👋","Our new teacher is very friendly."],["careful","/ˈkeəfl/","cẩn thận","⚠️","Be careful with the scissors."],["confident","/ˈkɒnfɪdənt/","tự tin","😎","She is confident when she speaks English."],["active","/ˈæktɪv/","năng động","🏃","Jimmy is active. He plays sports every day."],["caring","/ˈkeərɪŋ/","chu đáo, biết quan tâm","💗","My sister is caring. She helps me a lot."],["hard-working","/ˌhɑːd ˈwɜːkɪŋ/","chăm chỉ","📖","Phong is hard-working. He studies a lot."],["funny","/ˈfʌni/","vui tính, hài hước","😂","Tom is funny. He always makes us laugh."]]},{"g":"Activities – Hoạt động","w":[["picnic","/ˈpɪknɪk/","buổi dã ngoại","🧺","We are having a picnic in the park."],["biscuits","/ˈbɪskɪts/","bánh quy","🍪","Mai is bringing some biscuits."],["bookshop","/ˈbʊkʃɒp/","hiệu sách","🏪","They are going to the bookshop."],["summer camp","/ˈsʌmə kæmp/","trại hè","⛺","Nam is at a summer camp."],["photos","/ˈfəʊtəʊz/","những bức ảnh","📷","Phong is taking photos."]]}],"structs":[{"em":"🎬","ti":"Hiện tại tiếp diễn (khẳng định)","f":"S + {am / is / are} + {V-ing}","ex":"Nói việc <b>đang xảy ra ngay lúc nói</b>. Hay đi với <b>now, at the moment, at present, Look!, Listen!</b>","p":[["She is talking to her friend now.","Bạn ấy đang nói chuyện với bạn."],["We are having a picnic in the park.","Chúng mình đang đi dã ngoại ở công viên."],["I am reading a comic book.","Mình đang đọc truyện tranh."]]},{"em":"🚫","ti":"Hiện tại tiếp diễn (phủ định)","f":"S + {am not / isn't / aren't} + {V-ing}","ex":"Thêm <b>not</b> sau am / is / are. is not = <b>isn't</b>, are not = <b>aren't</b>.","p":[["They aren't talking now.","Họ đang không nói chuyện."],["He isn't playing the piano.","Cậu ấy đang không chơi piano."],["I am not watching TV.","Mình đang không xem TV."]]},{"em":"❔","ti":"Hiện tại tiếp diễn (câu hỏi)","f":"{Am / Is / Are} + S + {V-ing}? – Yes, S + {am / is / are}. / No, S + {'m not / isn't / aren't}.","ex":"Đưa <b>am / is / are</b> lên đầu câu. Hỏi đang làm gì: <b>What + is/are + S + doing?</b>","p":[["Is Mai playing the violin? – Yes, she is.","Mai đang chơi vi-ô-lông phải không? – Đúng vậy."],["Are they going to the bookshop? – No, they aren't.","Họ đang đi hiệu sách à? – Không."],["What are you doing? – I'm writing a letter.","Bạn đang làm gì? – Mình đang viết thư."]]},{"em":"👀","ti":"Tả ngoại hình","f":"S + {has / have} + {tính từ} + {bộ phận cơ thể}","ex":"Tả người dùng <b>has / have</b> (có). Thứ tự: <b>dài/ngắn</b> → <b>kiểu</b> → <b>màu</b> + hair: long <b>curly black</b> hair.","p":[["She has long black hair.","Bạn ấy có mái tóc dài màu đen."],["Phong has big brown eyes.","Phong có đôi mắt to màu nâu."],["They have round faces.","Họ có khuôn mặt tròn."]]},{"em":"🧑‍🤝‍🧑","ti":"Hỏi về ngoại hình","f":"What does {S} look like? – {He / She} has ... / {He / She} is {tall / short}.","ex":"<b>look like</b> hỏi về <b>vẻ bề ngoài</b>. Trả lời bằng has + tóc, mắt... hoặc is + tall / short.","p":[["What does your best friend look like?","Bạn thân của bạn trông thế nào?"],["She is tall and she has short hair.","Bạn ấy cao và có tóc ngắn."],["What does Chau look like? – She wears glasses.","Châu trông thế nào? – Bạn ấy đeo kính."]]},{"em":"💖","ti":"Hỏi về tính cách","f":"What {is / are} {S} like? – {He / She} is {kind / funny / clever}.","ex":"<b>What is ... like?</b> (không có look) hỏi về <b>tính cách</b>. Trả lời bằng is + tính từ.","p":[["What is your best friend like?","Bạn thân của bạn là người thế nào?"],["She is kind and funny.","Bạn ấy tốt bụng và vui tính."],["He is clever and hard-working.","Cậu ấy thông minh và chăm chỉ."]]}],"storyNote":"Story do Claude viết dựa theo tình huống email của Nam ở Superb Summer Camp trong Skills 1 Unit 3 (nhân vật Nam, Jimmy, Phong, Nhung); không phải nguyên văn sách.","story":["Dear Mum and Dad, <i class=\"s\">I'm having</i> a great time at Superb <b class=\"w\">summer camp</b>.","Everything here is in English!","I have three new friends. Jimmy is tall and he <i class=\"s\">has short black</i> <b class=\"w\">hair</b>.","He is very <b class=\"w\">active</b>. He plays sports every day.","Phong <i class=\"s\">has</i> <b class=\"w\">curly</b> <b class=\"w\">hair</b> and big brown <b class=\"w\">eyes</b>. He is <b class=\"w\">clever</b> and <b class=\"w\">funny</b>.","Nhung <i class=\"s\">has long black</i> <b class=\"w\">hair</b>. She is <b class=\"w\">creative</b> and <b class=\"w\">kind</b>.","Right now, Jimmy and Phong <i class=\"s\">are playing</i> football, and Nhung <i class=\"s\">is taking</i> <b class=\"w\">photos</b>.","<i class=\"s\">I'm writing</i> to you. Love, Nam."],"qs":[["Is everything at the camp in English?","Y","Yes, it is.","Everything here is in English!","Mọi thứ ở trại đều bằng tiếng Anh."],["Does Jimmy have long hair?","N","No, he doesn't. He has short black hair.","Jimmy is tall and he has short black hair.","Jimmy có tóc ngắn màu đen."],["Is Phong clever and funny?","Y","Yes, he is.","He is clever and funny.","Phong thông minh và vui tính."],["Is Nhung playing football now?","N","No, she isn't. She is taking photos.","Nhung is taking photos.","Nhung đang chụp ảnh."],["Is Nam writing to his parents?","Y","Yes, he is.","I'm writing to you. Love, Nam.","Nam đang viết thư cho bố mẹ."]],"mcq":[["Look! She ___ the piano.",["plays","is playing","play"],1,"Look! → hành động đang xảy ra → hiện tại tiếp diễn."],["They ___ talking now.",["isn't","aren't","not"],1,"They đi với are → aren't."],["___ Mai playing the violin?",["Is","Are","Does"],0,"Mai = she → Is."],["She ___ long black hair.",["have","has","is"],1,"She + has."],["What does your friend ___ like?",["look","looks","looking"],0,"What does ... look like? (sau does động từ nguyên mẫu)."],["What ___ your best friend like? – She is kind.",["does","is","do"],1,"Hỏi tính cách: What is ... like?"],["Phong always makes us laugh. He is ___.",["shy","funny","careful"],1,"Làm mọi người cười → funny."],["She studies a lot. She is ___.",["hard-working","active","blonde"],0,"Học nhiều → hard-working."],["I ___ reading a comic book.",["is","are","am"],2,"I + am."],["What are you doing? – I ___ a letter.",["write","am writing","writes"],1,"Trả lời bằng hiện tại tiếp diễn."]],"qw":[["I'm writing a letter to my mum.",["What are you doing?","What are you doing now?"]],["She's tall and she has long black hair.",["What does she look like?"]],["He is kind and funny.",["What is he like?","What's he like?"]],["Yes, she is. Mai is playing the violin now.",["Is Mai playing the violin?","Is Mai playing the violin now?"]],["No, they aren't. They aren't going to the bookshop.",["Are they going to the bookshop?"]],["They are having a picnic in the park.",["What are they doing?","Where are they having a picnic?"]],["Chau has big brown eyes and she wears glasses.",["What does Chau look like?"]],["My best friend is Phong. He is clever.",["Who is your best friend?","Who's your best friend?"]],["Yes, he is. He is taking photos now.",["Is he taking photos?","Is he taking photos now?"]],["No, I'm not. I'm not watching TV.",["Are you watching TV?","Are you watching TV now?"]]],"mistakes":[["thiếu am/is/are","She playing the piano now.","She is playing the piano now.","Hiện tại tiếp diễn cần đủ <b>is + V-ing</b>."],["V-ing","They are play football.","They are playing football.","Sau am / is / are động từ phải <b>thêm -ing</b>."],["has / have","She have long hair.","She has long hair.","She đi với <b>has</b>."],["thứ tự tính từ","He has black short hair.","He has short black hair.","Thứ tự: <b>dài/ngắn trước, màu sau</b>."],["hair không đếm","She has long hairs.","She has long hair.","Tóc trên đầu là <b>không đếm được</b> → hair, không thêm s."],["look like","What does she like? (hỏi ngoại hình)","What does she look like?","Hỏi <b>ngoại hình</b> phải có <b>look like</b>."],["What is ... like","What is she look like?","What does she look like?","<b>look like</b> đi với <b>does</b>; còn <b>What is she like?</b> là hỏi tính cách."],["now + tiếp diễn","Listen! Mai sings.","Listen! Mai is singing.","Có <b>Listen! / Look! / now</b> → dùng hiện tại tiếp diễn."]]},{"n":4,"en":"My Neighbourhood","vi":"Khu phố của em","pages":"38–47","vocab":[{"g":"Places – Địa điểm","w":[["neighbourhood","/ˈneɪbəhʊd/","khu phố, hàng xóm","🏘️","I love my neighbourhood."],["square","/skweə/","quảng trường","⛲","There is a big square in the city centre."],["art gallery","/ˈɑːt ˌɡæləri/","phòng trưng bày tranh","🖼️","The art gallery is next to the park."],["cathedral","/kəˈθiːdrəl/","nhà thờ lớn","⛪","The cathedral is very old and beautiful."],["temple","/ˈtempl/","ngôi đền","🛕","We visit the temple at the weekend."],["railway station","/ˈreɪlweɪ ˌsteɪʃn/","nhà ga xe lửa","🚉","The railway station is noisy and crowded."],["memorial","/məˈmɔːriəl/","đài tưởng niệm","🗿","There is a memorial in the square."],["park","/pɑːk/","công viên","🌳","Children play in the park every afternoon."],["post office","/ˈpəʊst ˌɒfɪs/","bưu điện","🏤","The post office is on Tran Phu Street."],["market","/ˈmɑːkɪt/","chợ","🛒","My mum goes to the market every morning."]]},{"g":"Describing places – Tả nơi chốn","w":[["historic","/hɪˈstɒrɪk/","cổ kính, có tính lịch sử","🏯","Hoi An is a historic town."],["noisy","/ˈnɔɪzi/","ồn ào","📢","My street is noisy at night."],["quiet","/ˈkwaɪət/","yên tĩnh","🤫","The countryside is quiet."],["crowded","/ˈkraʊdɪd/","đông đúc","👥","The market is crowded at the weekend."],["peaceful","/ˈpiːsfl/","yên bình","🕊️","My village is peaceful."],["modern","/ˈmɒdn/","hiện đại","🏙️","Our city has many modern buildings."],["narrow","/ˈnærəʊ/","hẹp","🚶","The streets in the old town are narrow."],["wide","/waɪd/","rộng","🛣️","This road is wide and clean."],["convenient","/kənˈviːniənt/","thuận tiện","🏪","Living here is convenient."],["polluted","/pəˈluːtɪd/","bị ô nhiễm","🏭","The air in the city is polluted."],["exciting","/ɪkˈsaɪtɪŋ/","sôi động, thú vị","🎢","The city centre is exciting."],["boring","/ˈbɔːrɪŋ/","buồn tẻ","🥱","My town is quiet but not boring."]]},{"g":"Directions – Chỉ đường","w":[["go straight","/ɡəʊ streɪt/","đi thẳng","⬆️","You go straight to the end of the street."],["turn left","/tɜːn left/","rẽ trái","⬅️","Go straight and turn left."],["turn right","/tɜːn raɪt/","rẽ phải","➡️","Go straight and then turn right."],["crossroads","/ˈkrɒsrəʊdz/","ngã tư","🚦","Turn left at the crossroads."]]}],"structs":[{"em":"📏","ti":"So sánh hơn – tính từ ngắn","f":"S1 + be + {tính từ + er} + than + S2","ex":"Tính từ <b>1 âm tiết</b> (hoặc 2 âm tiết tận cùng -y) thêm <b>-er</b>: quiet → quieter, big → bigger, noisy → noisier. Sau đó dùng <b>than</b>.","p":[["The city is noisier than the countryside.","Thành phố ồn ào hơn nông thôn."],["My street is wider than your street.","Đường nhà mình rộng hơn đường nhà bạn."],["Hoi An is smaller than Ha Noi.","Hội An nhỏ hơn Hà Nội."]]},{"em":"📐","ti":"So sánh hơn – tính từ dài","f":"S1 + be + more + {tính từ dài} + than + S2","ex":"Tính từ <b>từ 2 âm tiết trở lên</b> (không tận cùng -y) dùng <b>more</b> đứng trước: more modern, more peaceful, more convenient.","p":[["My village is more peaceful than the city.","Làng mình yên bình hơn thành phố."],["The new market is more modern than the old one.","Chợ mới hiện đại hơn chợ cũ."],["Living in a city is more convenient.","Sống ở thành phố thuận tiện hơn."]]},{"em":"⭐","ti":"So sánh hơn đặc biệt","f":"good → {better}, bad → {worse}, far → {further}","ex":"Một số tính từ <b>không theo quy tắc</b>, phải học thuộc: good → <b>better</b>, bad → <b>worse</b>.","p":[["The weather here is better than in the city.","Thời tiết ở đây tốt hơn ở thành phố."],["The air in the city is worse than in the village.","Không khí ở thành phố tệ hơn ở làng."],["My new school is better than my old school.","Trường mới của mình tốt hơn trường cũ."]]},{"em":"🏘️","ti":"Hỏi về khu phố","f":"What's your neighbourhood like? – It's {tính từ}.","ex":"<b>What is ... like?</b> hỏi <b>nơi đó thế nào</b>. Trả lời bằng It's + tính từ (quiet, noisy, crowded...).","p":[["What's your neighbourhood like?","Khu phố của bạn thế nào?"],["It's quiet and peaceful.","Nó yên tĩnh và thanh bình."],["It's noisy but it's very exciting.","Nó ồn ào nhưng rất sôi động."]]} , there is. There is a market near here.",["Is there a market near here?"]],["The city is noisier than the countryside.",["Which is noisier, the city or the countryside?","Is the city noisier than the countryside?"]],["I live in Hoi An. It's a historic town.",["Where do you live?"]],["Yes, it is. My street is very noisy at night.",["Is your street noisy at night?","Is your street noisy?"]],["No, it isn't. It isn't very convenient.",["Is it convenient?","Is your neighbourhood convenient?"]],["I like it because the people are friendly.",["Why do you like your neighbourhood?","Why do you like it?"]],["No, there isn't. There isn't a railway station here.",["Is there a railway station here?","Is there a railway station near here?"]],["The art gallery is next to the park.",["Where is the art gallery?","Where's the art gallery?"]]],"mistakes":[["-er + than","The city is noisy than the countryside.","The city is noisier than the countryside.","So sánh hơn phải đổi tính từ: noisy → <b>noisier</b>."],["more + tính từ dài","My village is peacefuler than the city.","My village is more peaceful than the city.","Tính từ dài dùng <b>more</b>, không thêm -er."],["không dùng 2 lần","It is more quieter here.","It is quieter here.","Đã thêm <b>-er</b> thì <b>không dùng more</b> nữa."],["better","My school is gooder than yours.","My school is better than yours.","good → <b>better</b> (bất quy tắc)."],["than / that","Ha Noi is bigger that Hoi An.","Ha Noi is bigger than Hoi An.","So sánh dùng <b>than</b>, không phải that."],["on your right","The temple is in your right.","The temple is on your right.","Nói <b>on your right / on your left</b>."],["bigger","My house is biger than your house.","My house is bigger than your house.","big → <b>bigger</b> (gấp đôi phụ âm cuối)."]]},{"n":5,"en":"Natural Wonders of Viet Nam","vi":"Kỳ quan thiên nhiên Việt Nam","pages":"48–57","vocab":[{"g":"Things in nature – Thiên nhiên","w":[["natural wonder","/ˌnætʃrəl ˈwʌndə/","kỳ quan thiên nhiên","✨","Ha L var P=null;
function norm(s){s=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g," ");
 var map={"what's":"what is","where's":"where is","when's":"when is","who's":"who is","it's":"it is","he's":"he is","she's":"she is","there's":"there is","that's":"that is","how's":"how is","i'm":"i am","they're":"they are","we're":"we are","you're":"you are","i'd":"i would","don't":"do not","doesn't":"does not","isn't":"is not","aren't":"are not","can't":"can not","cannot":"can not","wasn't":"was not","weren't":"were not","mustn't":"must not","shouldn't":"should not","didn't":"did not","haven't":"have not"};
 s=s.replace(/[a-z']+/g,function(w){return map[w]||w});return s.replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}

 var seen={};return ss.filter(function(s){var n=s.split(/\s+/).length;if(n<4||n>9||/[.?!]\s/.test(s)||seen[s])return false;seen[s]=1;return true})}
function buildPractice(){var u=U(),words=allWords(u);var w1=shuffle(words).slice(0,10);

  ex3:w3.map(function(w){return {w:w,wrong:0}}),

 $$("#it0 .item").forEach(function(it){it.addEventListener("click",function(e){var b=e.target.closest(".opt");if(!b||it.dataset.done)return;it.dataset.done=1;var q=P.ex1[+it.dataset.i],o=q.opts[+b.dataset.j],ok=o===q.w;
  P.s[0][+it.dataset.i]=ok?1:0;b.classList.add(ok?"good":"bad");$$(".opt",it).forEach(function(x,j){x.disabled=true;if(q.opts[j]===q.w)x.classList.add("good")});
  $(".fbx",it).innerHTML='<span class="done '+(ok?"ok":"no")+'">'+(ok?"✅ Đúng rồi!":"❌ Đáp án: "+esc(q.w[0]))+'</span> – '+esc(q.w[2]);speak(q.w[0],{rate:0.72});upd()})});
 // ex2
 $("#it1").innerHTML=P.ex2.map(function(q,i){return '<div class="item" data-i="'+i+'"><div class="hd"><span class="num">'+(i+1)+'</span><b>'+esc(q.m[0]).replace("___","<u>&nbsp;?&nbsp;</u>")+'</b></div><div class="opts">'+q.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+esc(o.t)+'</button>'}).join("")+'</div><div class="fbx"></div></div>'}).join("");
 $$("#it1 .item").forEach(function(it){it.addEventListener("click",function(e){var b=e.target.closest(".opt");if(!b||it.dataset.done)return;it.dataset.done=1;var q=P.ex2[+it.dataset.i],ok=q.opts[+b.dataset.j].ok;
  P.s[1][+it.dataset.i]=ok?1:0;b.classList.add(ok?"good":"bad");$$(".opt",it).forEach(function(x,j){x.disabled=true;if(q.opts[j].ok)x.classList.add("good")});
  var full=q.m[0].replace("___",q.m[1][q.m[2]]).replace(/\s*\(.*?\)/,"");$(".fbx",it).innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ ":"❌ ")+'<b>'+esc(full)+'</b><br>💡 '+esc(q.m[3])+'</div>';if(ok)speak(full,{rate:0.8});upd()})});
 // ex3
 $("#it2").innerHTML=P.ex3.map(function(q,i){var s=q.w[4],m=s.match(wordRe(q.w[0])),at=m.index+m[1].length;
  return '<div class="item" data-i="'+i+'"><div class="hd"><span class="num">'+(i+1)+'</span>'+spkBtn(s,0.78,false,"Nghe câu số "+(i+1))+'<span>'+esc(s.slice(0,at))+'<input class="fill" id="f3-'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Từ còn thiếu câu '+(i+1)+'">'+esc(s.slice(at+q.w[0].length))+'</span></div><div class="ctl"><button class="btn sm chk">Kiểm tra</button><button class="btn sm rev" hidden>👀 Xem đáp án</button><span class="fbx"></span></div></div>'}).join("");
 bindCheck("#it2",2,P.ex3,function(q,it){var v=$("input",it).value;if(!v.trim())return null;return norm(v)===norm(q.w[0])},function(q){return q.w[0]},function(q,it){$("input",it).value=q.w[0]},function(q){speak(q.w[4],{rate:0.78})});
 // ex4
 $("#it3").innerHTML=P.ex4.map(function(q,i){return '<div class="item" data-i="'+i+'"><div class="hd"><span class="num">'+(i+1)+'</span><div class="ans" aria-label="Câu của em"></div></div><div class="tray">'+q.sh.map(function(t){return '<button class="tk" data-k="'+t.i+'">'+esc(t.t)+'</button>'}).join("")+'</div><div class="ctl"><button class="btn sm chk">Kiểm tra</button><button class="btn sm rev" hidden>👀 Xem đáp án</button><span class="fbx"></span></div></div>'}).join("");
 $$("#it3 .item").forEach(function(it){it.addEventListener("click",function(e){var t=e.target.closest(".tk");if(!t||it.dataset.done)return;var tray=$(".tray",it),ans=$(".ans",it);(t.parentNode===tray?ans:tray).appendChild(t)})});
 bindCheck("#it3",3,P.ex4,function(q,it){var got=$$(".ans .tk",it).map(function(b){return b.textContent});if(got.length<q.toks.length)return null;return got.join(" ")===q.toks.join(" ")},function(q){return q.s},function(q,it){var ans=$(".ans",it);q.toks.forEach(function(t,k){var b=$('.tk[data-k="'+k+'"]',it);if(b)ans.appendChild(b)})},null);
 // ex5
 $("#it4").innerHTML=P.ex5.map(function(q,i){return '<div class="item" data-i="'+i+'"><div class="hd"><span class="num">'+(i+1)+'</span><span>Trả lời: <b>'+esc(q.q[0])+'</b></span></div><input class="qin" id="q5-'+i+'" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Viết câu hỏi của em…" aria-label="Câu hỏi cho câu trả lời số '+(i+1)+'"><div class="ctl"><button class="btn sm chk">Kiểm tra</button><button class="btn sm rev" hidden>👀 Xem đáp án</button><span class="fbx"></span></div></div>'}).join("");

function bindCheck(sel,k,arr,test,answer,fill,onOk){
 $$(sel+" .item").forEach(function(it){var i=+it.dataset.i,q=arr[i],fb=$(".fbx",it),rev=$(".rev",it),chk=$(".chk",it);
  function ok(show){it.dataset.done=1;chk.disabled=true;rev.hidden=true;$$("input",it).forEach(function(x){x.readOnly=true});
   fb.innerHTML='<span class="done ok">✅ Đúng rồi!</span>'+(k===3?' <b>'+esc(q.s)+'</b>':'');if(onOk)onOk(q,it)}
  chk.onclick=function(){if(it.dataset.done)return;var r=test(q,it);if(r===null){fb.innerHTML='<span class="note">Em làm xong rồi bấm Kiểm tra nhé.</span>';return}
   if(r){if(q.wrong===0&&P.s[k][i]!==0)P.s[k][i]=1;ok();upd()}
   else{q.wrong++;P.s[k][i]=0;fb.innerHTML='<span class="done no">❌ Chưa đúng, thử lại nhé!</span>';if(q.wrong>=2)rev.hidden=false;upd()}};
  rev.onclick=function(){P.s[k][i]=0;fill(q,it);it.dataset.done=1;chk.disabled=true;rev.hidden=true;fb.innerHTML='<span class="done no">Đáp án: <b>'+esc(answer(q))+'</b></span>';upd()};
  $$("input",it).forEach(function(inp){inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();chk.click()}})})})}

function renderFlash(){var u=U();var h='<div class="sec-h"><h2>Thẻ ghi nhớ</h2><span class="note">Phím: Space lật thẻ · → Đã thuộc · ← Chưa thuộc</span></div><div class="deck"><button class="btn'+(F.deck==="v"?" sel":"")+'" data-deck="v">📖 Bộ Từ vựng</button><button class="btn'+(F.deck==="s"?" sel":"")+'" data-deck="s">💬 Bộ Câu</button><button class="btn" id="frestart">🔄 Học lại từ đầu</button></div>';

  $("#p-flash").innerHTML=h;bindDeck();$("#fagain").onclick=function(){startDeck(F.deck)};$("#fnext").onclick=function(){startDeck(F.deck==="v"?"s":"v")};speak("Congratulations!",{rate:0.85});return}
